[project]
name = "CipherForge"
version = "0.1"
description = "An educational file encryption tool"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
